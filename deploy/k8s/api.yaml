# Score server (P15): one small Node pod. The HTTPRoute in marble.yaml sends /api to it.
# Database credentials come from the Secret marble-db (created by hand, see DECISIONS P16).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marble-api
  namespace: marble-melancholy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: marble-api
  template:
    metadata:
      labels:
        app: marble-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: API_IMAGE
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: marble-db
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            # Replaying a full 2P course takes about a CPU second; allow bursts.
            limits:
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: marble-api
  namespace: marble-melancholy
spec:
  selector:
    app: marble-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: marble-api-health-check
  namespace: marble-melancholy
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /api/health
  targetRef:
    group: ""
    kind: Service
    name: marble-api
